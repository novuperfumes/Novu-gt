<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novu - Colecciones Exclusivas</title>
    <meta name="description"
        content="Explora nuestras colecciones exclusivas: Árabe, Diseñador y Nicho. Diseños premium adaptados a tu estilo de vida.">
    <!-- Google Fonts: Montserrat para un look geométrico y elegante; Syne para toques modernos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cart-modal.css">
</head>

<body>
    <!-- Encabezado Minimalista Premium -->
    <header class="site-header">
        <a href="#" class="brand-logo" id="logo-link">NOVU</a>

        <div class="header-actions" style="display: flex; align-items: center; gap: 25px; margin-right: 20px;">
            <a href="#" class="action-icon-link" aria-label="Mi Perfil"
                style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #ffffff; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; transition: opacity 0.2s;">
                <svg class="header-svg-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" style="width: 22px; height: 22px; stroke-width: 1.5;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="action-label">Iniciar Sesión</span>
            </a>
            <a href="#" class="action-icon-link cart-link" aria-label="Carrito de compras"
                style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #ffffff; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; transition: opacity 0.2s;">
                <div class="cart-icon-wrapper" style="position: relative; display: flex; align-items: center;">
                    <svg class="header-svg-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" style="width: 22px; height: 22px; stroke-width: 1.5;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                    <span class="cart-badge"
                        style="position: absolute; top: -8px; right: -8px; background-color: #C5A059; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 0.6rem; display: none; align-items: center; justify-content: center; font-weight: 700;">0</span>
                </div>
            </a>
        </div>

        <button class="menu-toggle" aria-label="Abrir menú" id="menu-btn">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
        </button>
    </header>

    <!-- Contenedor Principal de Columnas -->
    <main class="collections-container">
        <!-- Sección 1: Árabe -->
        <section class="collection-column" id="col-arabe"
            style="--bg-image: url('imagenes/arabe.jpg'); --fallback-gradient: linear-gradient(135deg, #1f1c18 0%, #3a3025 100%);">
            <div class="column-overlay"></div>
            <div class="column-content">
                <h2 class="collection-title">ÁRABE</h2>
                <a href="arabe.html" class="cta-button" id="btn-arabe">
                    <span class="cta-text">CONOCE MÁS</span>
                    <span class="cta-hover-bg"></span>
                </a>
            </div>
        </section>

        <!-- Sección 2: Diseñador -->
        <section class="collection-column" id="col-disenador"
            style="--bg-image: url('imagenes/diseñador.jpg'); --fallback-gradient: linear-gradient(135deg, #141b29 0%, #0c101b 100%);">
            <div class="column-overlay"></div>
            <div class="column-content">
                <h2 class="collection-title">DISEÑADOR</h2>
                <a href="disenador.html" class="cta-button" id="btn-disenador">
                    <span class="cta-text">CONOCE MÁS</span>
                    <span class="cta-hover-bg"></span>
                </a>
            </div>
        </section>

        <!-- Sección 3: Nicho -->
        <section class="collection-column" id="col-nicho"
            style="--bg-image: url('imagenes/nicho.jpg'); --fallback-gradient: linear-gradient(135deg, #1e2522 0%, #0f1412 100%);">
            <div class="column-overlay"></div>
            <div class="column-content">
                <h2 class="collection-title">NICHO</h2>
                <a href="nicho.html" class="cta-button" id="btn-nicho">
                    <span class="cta-text">CONOCE MÁS</span>
                    <span class="cta-hover-bg"></span>
                </a>
            </div>
        </section>
    </main>

    <!-- Menú de Navegación Overlay (Funcional e Interactivo) -->
    <div class="navigation-overlay" id="nav-overlay">
        <nav class="overlay-nav">
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="arabe.html" class="nav-link">Árabe</a></li>
                <li><a href="disenador.html" class="nav-link">Diseñador</a></li>
                <li><a href="nicho.html" class="nav-link">Nicho</a></li>
                <li><a href="faq.html" class="nav-link">Preguntas Frecuentes</a></li>
                <li><a href="sobre-nosotros.html" class="nav-link">Sobre Nosotros</a></li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
            </ul>
        </nav>
    </div>

    <script src="script.js"></script>
    <script src="cart-modal.js"></script>
</body>

</html>
